<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="FitTrack 健身打卡 App - Visily 原型高保真展示">
  <title>FitTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { background: #ebebeb; margin: 0; }

    /* 页面切换：淡入 + 轻微上移 */
    .page {
      display: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .page.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* 截图铺满手机框，不拉伸变形 */
    .screen-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 透明热区：hover 微反馈 */
    .hotspot {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .hotspot:hover { background: rgba(0,0,0,0.04); }
    .hotspot:active { background: rgba(0,0,0,0.08); }
  </style>
</head>
<body class="min-h-screen flex items-start sm:items-center justify-center py-0 sm:py-8 font-sans antialiased">

  <!--
    FitTrack 原型展示
    视觉层：直接使用 Visily 导出的 5 张截图，保证 1:1 还原
    交互层：透明热区覆盖可点击按钮/导航
  -->
  <div id="app" class="relative w-full max-w-[390px] h-[100dvh] sm:h-[844px] sm:rounded-[2.5rem] overflow-hidden bg-white sm:shadow-[0_25px_50px_-12px_rgba(0,0,0,0.18)]">

    <!-- ========== 1. 启动页 / 闪屏页 ========== -->
    <div id="page-splash" class="page active relative w-full h-full">
      <img src="screens/01-splash.png" alt="启动页" class="screen-img" loading="eager">
      <!-- 点击任意区域跳过 -->
      <button class="hotspot inset-0 w-full h-full" aria-label="进入登录页" data-go="login"></button>
    </div>

    <!-- ========== 2. 登录页 ========== -->
    <div id="page-login" class="page relative w-full h-full">
      <img src="screens/02-login.png" alt="登录页" class="screen-img" loading="lazy">
      <!-- 「登录」按钮热区（按截图比例定位） -->
      <button class="hotspot left-[6%] right-[6%] top-[44%] h-[5.5%] rounded-xl" aria-label="登录" data-go="home"></button>
    </div>

    <!-- ========== 3. 首页 ========== -->
    <div id="page-home" class="page relative w-full h-full">
      <img src="screens/03-home.png" alt="首页" class="screen-img" loading="lazy">
      <!-- 底部导航热区 -->
      <button class="hotspot left-0 w-1/3 bottom-0 h-[11%]" aria-label="首页" data-go="home"></button>
      <button class="hotspot left-1/3 w-1/3 bottom-0 h-[11%]" aria-label="训练" data-go="training"></button>
      <button class="hotspot left-2/3 w-1/3 bottom-0 h-[11%]" aria-label="我的" data-go="profile"></button>
    </div>

    <!-- ========== 4. 训练页 ========== -->
    <div id="page-training" class="page relative w-full h-full">
      <img src="screens/04-training.png" alt="训练页" class="screen-img" loading="lazy">
      <button class="hotspot left-0 w-1/3 bottom-0 h-[11%]" aria-label="首页" data-go="home"></button>
      <button class="hotspot left-1/3 w-1/3 bottom-0 h-[11%]" aria-label="训练" data-go="training"></button>
      <button class="hotspot left-2/3 w-1/3 bottom-0 h-[11%]" aria-label="我的" data-go="profile"></button>
    </div>

    <!-- ========== 5. 个人中心页 ========== -->
    <div id="page-profile" class="page relative w-full h-full">
      <img src="screens/05-profile.png" alt="个人中心" class="screen-img" loading="lazy">
      <!-- 底部导航 -->
      <button class="hotspot left-0 w-1/3 bottom-0 h-[11%]" aria-label="首页" data-go="home"></button>
      <button class="hotspot left-1/3 w-1/3 bottom-0 h-[11%]" aria-label="训练" data-go="training"></button>
      <button class="hotspot left-2/3 w-1/3 bottom-0 h-[11%]" aria-label="我的" data-go="profile"></button>
      <!-- 「退出登录」热区 -->
      <button class="hotspot left-[6%] right-[6%] bottom-[13%] h-[4.5%] rounded-xl" aria-label="退出登录" data-go="login"></button>
    </div>

  </div>

  <script>
  (function () {
    'use strict';

  var current = 'splash';

    /** 切换页面 */
    function showPage(name) {
      if (name === current) return;
      document.getElementById('page-' + current).classList.remove('active');
      document.getElementById('page-' + name).classList.add('active');
      current = name;
    }

    /* 热区点击 */
    document.querySelectorAll('[data-go]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        showPage(btn.dataset.go);
      });
    });

    /* 启动页 2.5 秒后自动进入登录页 */
    setTimeout(function () {
      if (current === 'splash') showPage('login');
    }, 2500);

  })();
  </script>
</body>
</html>
